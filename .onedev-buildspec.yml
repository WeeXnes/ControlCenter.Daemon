version: 43
jobs:
- name: Build & Publish Standalone Daemon
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Dotnet Publish (Linux x64 Standalone)
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Publishing ControlCenter.Daemon as standalone self-contained binary for Linux x64..."
        mkdir -p ./release
        dotnet publish ControlCenter.Daemon.csproj \
                    -c Release \
                    -r linux-x64 \
                    --self-contained true \
                    -p:PublishSingleFile=true \
                    -p:EnableCompressionInSingleFile=true \
                    -o ./output_linux
        (cd ./output_linux && tar -czvf ../release/ControlCenter.Daemon_Linux_x64.tar.gz .)
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Dotnet Publish (Windows x64 Standalone)
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Publishing ControlCenter.Daemon as standalone self-contained binary for Windows x64..."
        dotnet publish ControlCenter.Daemon.csproj \
                    -c Release \
                    -r win-x64 \
                    --self-contained true \
                    -p:PublishSingleFile=true \
                    -p:EnableCompressionInSingleFile=true \
                    -o ./output_win
        (cd ./output_win && zip -r ../release/ControlCenter.Daemon_Windows_x64.zip .)
        rm -rf ./output_linux ./output_win
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: Upload Artifacts
    sourcePath: release
    artifacts: '**'
    condition: ALWAYS
    optional: false
  - type: CommandStep
    name: get version
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        echo "Extracting version from ControlCenter.Daemon.csproj..."
        grep -oP '<Version>\K[^<]+' ControlCenter.Daemon.csproj > version.txt || echo "1.0.0" > version.txt
        echo "Version extracted: $(cat version.txt)"
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: check if tag exists
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        version=$(cat version.txt)
        echo "Checking if tag '$version' exists on origin..."

        if git ls-remote --tags origin | grep -q "refs/tags/${version}$"; then
            echo "Tag '$version' already exists."
            exit 1
        else
            echo "Tag '$version' does not exist. Proceeding to create tag."
            exit 0
        fi
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:version.txt@'
    condition: ALWAYS
    optional: false
  - type: CreateTagStep
    name: create tag
    tagName: '@file:version.txt@'
    tagMessage: 'Release @file:version.txt@'
    condition: SUCCESSFUL
    optional: false
  jobExecutor: Builder
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: PullRequestUpdateTrigger
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400

- name: Release Stable AUR
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@tag@'
    condition: ALWAYS
    optional: false
  - type: CommandStep
    name: Update Stable AUR Package
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        repo_url="ssh://aur@@aur.archlinux.org/controlcenter-daemon.git"
        repo_dir="controlcenter-daemon"

        git clone "$repo_url"

        version=@tag@

        sed -i "s/^pkgver=.*/pkgver=${version}/" "$repo_dir/PKGBUILD"

        (
          cd "$repo_dir" || exit 1
          makepkg --printsrcinfo > .SRCINFO
          git add PKGBUILD .SRCINFO
          git commit -m "Automatically updated version to ${version}"
          git push
        )
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  jobExecutor: Builder
  triggers:
  - type: TagCreateTrigger
    branches: master
    projects: ControlCenter/ControlCenter.Daemon
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
